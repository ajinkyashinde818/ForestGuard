services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forestguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forestguard_dev}
      POSTGRES_DB: ${POSTGRES_DB:-forestguard}
    volumes: [forestguard-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-forestguard}:${POSTGRES_PASSWORD:-forestguard_dev}@db:5432/${POSTGRES_DB:-forestguard}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      AUDIO_STORAGE_DIR: /app/private-audio
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-10485760}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-120}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    volumes: [forestguard-audio:/app/private-audio]
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npx prisma db push && node dist/src/main.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  forestguard-db:
  forestguard-audio:
